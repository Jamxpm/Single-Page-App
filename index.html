<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simply Weather Lookup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="weather" aria-labelledby="weather-heading">
      <h2 id="weather-heading">Simply Weather Lookup</h2>

      <form class="weatherForm" aria-label="City weather lookup">
        <label for="city">City</label>
        <input
          class="cityInput"
          id="city"
          name="city"
          type="text"
          placeholder="Enter a city"
          autocomplete="address-level2"
          required
        >
        <button type="submit">Get Weather</button>
      </form>

      <output
        class="card"
        id="weather-result"
        for="city"
        aria-live="polite"
        hidden
      ></output>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
