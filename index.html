<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simply Weather Lookup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="weather" aria-labelledby="weather-heading">
      <h2 id="weather-heading">Simply Weather Lookup</h2>

      <form class="weatherForm">
        <label for="city">City</label>
        <input
          class="cityInput"
          id="city"
          name="city"
          type="text"
          placeholder="Enter a city"
          autocomplete="off"
          required
        >
        <button type="submit">Get Weather</button>
      </form>

      <div class="card" role="status" aria-live="polite" style="display: none;"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
